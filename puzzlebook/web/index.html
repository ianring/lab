<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐉</span>
      <div class="brand-text">
        <h1>Dragon Hunt</h1>
        <p class="subtitle">Watching the puzzlebook chain solve itself, one step at a time</p>
      </div>
    </div>
    <div class="progress-summary">
      <div class="stat"><span class="stat-value" id="stat-remaining">—</span><span class="stat-label">words left</span></div>
      <div class="stat"><span class="stat-value" id="stat-pct">—</span><span class="stat-label">eliminated</span></div>
      <div class="stat"><span class="stat-value" id="stat-stage">—</span><span class="stat-label">step</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-run-all">Run remaining</button>
      <button class="btn" id="btn-reset">Reset</button>
    </div>
  </header>
  <main class="layout">
    <aside class="rail" id="rail"></aside>
    <section class="book">
      <div class="legend">
        <span><i class="swatch struck"></i> crossed out</span>
        <span><i class="swatch revealed"></i> read for this step's reveal</span>
        <span><i class="swatch answer"></i> the answer</span>
      </div>
      <div id="book"></div>
    </section>
  </main>
</div>

<script>
"use strict";

/* ===================================================================
   Data: book.json and chain.json are fetched at load time (see "App
   state + rendering" below) -- this page carries no copy of the book
   or the chain itself. Both files are written by bin/build.php
   straight into web/, so what you see here is the exact book that was
   built, not a separate re-implementation of the construction logic.
   =================================================================== */

/* ===================================================================
   Layout math only -- where a word sits in the page/row/col grid, for
   rendering. This page does not evaluate any rule or reveal; every
   "what does the chain do" question is answered by web/api.php, which
   calls the one real implementation (lib/Engine.php) on the server.
   =================================================================== */

function linearIndex(grid, page, row, col) {
  return (page * grid.rows + row) * grid.cols + col;
}

/* ===================================================================
   App state + rendering
   =================================================================== */

let grid, totalWords, words, CHAIN;
let keep, removedAtStep, stepIndex, applied;
let loadedBook = null;
let loadedChain = null;

let busy = false;
let stepError = null;

function resetState() {
  grid = loadedBook.grid;
  words = loadedBook.words;
  totalWords = grid.pages * grid.rows * grid.cols;
  CHAIN = loadedChain;
  keep = new Array(totalWords).fill(true);
  removedAtStep = new Array(totalWords).fill(0);
  stepIndex = 0;
  applied = [];
  busy = false;
  stepError = null;
}

async function fetchJson(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) {
    throw new Error(`couldn't load ${path} (HTTP ${res.status})`);
  }
  return res.json();
}

const railEl = document.getElementById("rail");
const bookEl = document.getElementById("book");
const statRemaining = document.getElementById("stat-remaining");
const statPct = document.getElementById("stat-pct");
const statStage = document.getElementById("stat-stage");

let cellEls = [];

function buildBookDom() {
  bookEl.innerHTML = "";
  cellEls = new Array(totalWords);
  for (let page = 0; page < grid.pages; page++) {
    const pageEl = document.createElement("div");
    pageEl.className = "page";

    const head = document.createElement("div");
    head.className = "page-head";
    head.innerHTML = `<h3>Page ${page + 1}</h3><span class="page-count" data-page-count="${page}"></span>`;
    pageEl.appendChild(head);

    const gridEl = document.createElement("div");
    gridEl.className = "grid";
    for (let row = 0; row < grid.rows; row++) {
      for (let col = 0; col < grid.cols; col++) {
        const i = linearIndex(grid, page, row, col);
        const cellEl = document.createElement("div");
        cellEl.className = "cell";
        cellEl.innerHTML = `<span class="idx">${i + 1}</span>${words[i]}`;
        gridEl.appendChild(cellEl);
        cellEls[i] = cellEl;
      }
    }
    pageEl.appendChild(gridEl);
    bookEl.appendChild(pageEl);
  }
}

function pageSurvivorCount(page) {
  let n = 0;
  for (let row = 0; row < grid.rows; row++) {
    for (let col = 0; col < grid.cols; col++) {
      if (keep[linearIndex(grid, page, row, col)]) n++;
    }
  }
  return n;
}

function refreshPageCounts() {
  document.querySelectorAll("[data-page-count]").forEach((el) => {
    const page = Number(el.dataset.pageCount);
    el.textContent = `${pageSurvivorCount(page)} / ${grid.rows * grid.cols} left`;
  });
}

function clearRevealHighlights() {
  document.querySelectorAll(".cell.revealed").forEach((el) => {
    el.classList.remove("revealed");
    const badge = el.querySelector(".order-badge");
    if (badge) badge.remove();
  });
}

function applyRevealHighlights(cells) {
  cells.forEach((i, order) => {
    const el = cellEls[i];
    el.classList.add("revealed");
    const badge = document.createElement("span");
    badge.className = "order-badge";
    badge.textContent = String(order + 1);
    el.appendChild(badge);
  });
}

function applyStrikes(indices, stepId) {
  indices.forEach((i) => {
    cellEls[i].classList.add("struck");
    removedAtStep[i] = stepId;
    cellEls[i].title = `word ${i + 1} of ${totalWords} -- crossed out at step ${stepId}`;
  });
}

function markAnswer(i) {
  cellEls[i].classList.add("answer");
  cellEls[i].title = `word ${i + 1} of ${totalWords} -- the answer`;
}

function fmtPct(n) { return n.toFixed(1) + "%"; }

function updateGlobalStats() {
  const remaining = keep.reduce((n, k) => n + (k ? 1 : 0), 0);
  const removedPct = ((totalWords - remaining) / totalWords) * 100;
  statRemaining.textContent = remaining;
  statPct.textContent = fmtPct(removedPct);
  statStage.textContent = stepIndex >= CHAIN.steps.length ? "done" : `${stepIndex + 1} / ${CHAIN.steps.length}`;
  refreshPageCounts();
}

function renderRail() {
  railEl.innerHTML = "";
  CHAIN.steps.forEach((step, idx) => {
    const state = idx < stepIndex ? "done" : idx === stepIndex ? "current" : "upcoming";
    const card = document.createElement("div");
    card.className = `card is-${state}`;

    let badgeText, badgeClass;
    if (step.kind === "reveal") {
      badgeText = "reveal";
      badgeClass = "";
    } else if (step.final) {
      badgeText = "final";
      badgeClass = "final";
    } else if (step.printed) {
      badgeText = "printed";
      badgeClass = "printed";
    } else {
      badgeText = "hidden";
      badgeClass = "";
    }

    let html = `
      <div class="card-head">
        <h2>Step ${step.id}</h2>
        <span class="badge ${badgeClass}">${badgeText}</span>
      </div>
    `;

    html += step.kind === "eliminate"
      ? `<p class="rule-text">${step.rule_text}</p>`
      : `<p class="pattern-text">Reads <strong>${step.pattern_text}</strong>.</p>`;

    const record = applied[idx];
    if (record) {
      if (step.kind === "eliminate") {
        html += `
          <p class="stage-stats">
            removed <b>${record.removed.length}</b> of ${record.total} words
            (${fmtPct(record.pct_book)} of the whole book, ${fmtPct(record.pct_remaining)} of what remained)<br>
            <b>${record.after}</b> word${record.after === 1 ? "" : "s"} left
          </p>
        `;
        if (record.final) {
          const ok = record.final.ok;
          html += `
            <div class="final-banner ${ok ? "ok" : "bad"}">
              ${ok
                ? `✓ Exactly one word survived: <strong>${record.final.expected_answer.toUpperCase()}</strong> -- matches config/chain.php.`
                : `✗ Expected exactly one survivor ('${record.final.expected_answer}'), got `
                  + `${record.final.survivor_words.length}: ${record.final.survivor_words.join(", ")}.`}
            </div>
          `;
        }
      } else if (record.error) {
        html += `<p class="reveal-bad">reveal failed: ${record.error}</p>`;
      } else {
        html += `
          <p class="reveal-result">
            <span class="reveal-code">${record.text.toUpperCase()}</span>
            <span class="${record.matches_expected ? "reveal-ok" : "reveal-bad"}">${
              record.matches_expected ? "matches expected ✓" : `expected '${record.expected}'`
            }</span>
          </p>
        `;
      }
    }

    if (state === "current" && stepError) {
      html += `<p class="reveal-bad">${stepError}</p>`;
    }

    card.innerHTML = html;

    if (state === "current") {
      const foot = document.createElement("div");
      foot.className = "card-foot";
      const btn = document.createElement("button");
      btn.className = "btn btn-primary";
      btn.disabled = busy;
      btn.textContent = busy
        ? "Working…"
        : (step.kind === "reveal" ? `Reveal step ${step.id}` : `Apply step ${step.id}`);
      btn.addEventListener("click", () => applyOneStep());
      foot.appendChild(btn);
      card.appendChild(foot);
    }

    railEl.appendChild(card);
  });
}

async function applyOneStep() {
  if (!CHAIN || stepIndex >= CHAIN.steps.length || busy) return;

  busy = true;
  stepError = null;
  renderRail();

  try {
    const res = await fetch("api.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ step_index: stepIndex, keep }),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data && data.error ? data.error : `HTTP ${res.status}`);
    }

    clearRevealHighlights();

    if (data.kind === "eliminate") {
      keep = data.keep;
      applyStrikes(data.removed, CHAIN.steps[stepIndex].id);
      if (data.final && data.final.ok) {
        markAnswer(data.final.survivor_indices[0]);
      }
    } else if (!data.error) {
      applyRevealHighlights(data.cells);
    }

    applied[stepIndex] = data;
    stepIndex++;
    updateGlobalStats();
  } catch (err) {
    stepError = `Couldn't reach the server: ${String((err && err.message) || err)}`;
  } finally {
    busy = false;
    renderRail();
  }
}

async function runAllRemaining() {
  if (!CHAIN) return;
  while (stepIndex < CHAIN.steps.length && !stepError) {
    await applyOneStep();
  }
}

function fullReset() {
  if (!loadedBook || !loadedChain) return;
  resetState();
  buildBookDom();
  updateGlobalStats();
  renderRail();
}

function showLoadError(err) {
  railEl.innerHTML = `
    <div class="card is-current">
      <div class="card-head"><h2>Couldn't load the book</h2></div>
      <p class="rule-text">${String((err && err.message) || err)}</p>
      <p class="pattern-text">Run <code>php bin/build.php</code> on your server first -- it writes
      <code>book.json</code> and <code>chain.json</code> straight into this <code>web/</code> folder.
      Then reload this page from the same place those two files ended up.</p>
    </div>
  `;
  bookEl.innerHTML = "";
  statRemaining.textContent = "—";
  statPct.textContent = "—";
  statStage.textContent = "—";
}

async function boot() {
  try {
    const [book, chain] = await Promise.all([fetchJson("book.json"), fetchJson("chain.json")]);
    loadedBook = book;
    loadedChain = chain;
    fullReset();
  } catch (err) {
    showLoadError(err);
  }
}

document.getElementById("btn-run-all").addEventListener("click", runAllRemaining);
document.getElementById("btn-reset").addEventListener("click", fullReset);

boot();
</script>
